[package]
name = "openbolsa"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
eframe = { version = "0.37.0", features = ["persistence"] }
egui_extras = "0.37"
egui_plot = "0.38.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "default-tls", "json"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zip = { version = "9.1.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
